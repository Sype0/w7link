name: Build

on:
  push:
    branches: [main]
    paths-ignore: ["**.md"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v5

      - name: Link tests
        run: ./gradlew --console=plain :datalayer:testDebugUnitTest

      - name: Build APKs
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          HEARTLINE_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          HEARTLINE_KEY_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          HEARTLINE_KEY_ALIAS: w7link
        run: |
          version="0.2.${{ github.run_number }}"
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            export HEARTLINE_KEYSTORE_FILE="$RUNNER_TEMP/release.jks"
          fi
          ./gradlew --console=plain :phone:assembleRelease :wear:assembleRelease \
            -Pheartline.versionCode=${{ github.run_number }} -Pheartline.versionName="$version"
          cp phone/build/outputs/apk/release/phone-release.apk "w7link-phone-$version.apk"
          cp wear/build/outputs/apk/release/wear-release.apk "w7link-wear-$version.apk"
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: w7link-*.apk

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$VERSION" w7link-*-"$VERSION".apk \
            --title "v$VERSION" \
            --notes "Phone APK goes on the phone, wear APK on the watch (adb install). Unofficial fork of Heartline; source for this build is this tag."
